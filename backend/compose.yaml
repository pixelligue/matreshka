services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: matreshka
      POSTGRES_PASSWORD: matreshka
      POSTGRES_DB: matreshka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matreshka -d matreshka"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "matreshka"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "matreshka", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
