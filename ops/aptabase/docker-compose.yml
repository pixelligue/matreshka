services:
  aptabase_db:
    container_name: matreshka_aptabase_db
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: change-me-postgres

  aptabase_events_db:
    container_name: matreshka_aptabase_events
    image: clickhouse/clickhouse-server:23.8.4.69-alpine
    restart: unless-stopped
    volumes:
      - events-db-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: change-me-clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  aptabase:
    container_name: matreshka_aptabase
    image: ghcr.io/aptabase/aptabase:main
    restart: unless-stopped
    depends_on:
      - aptabase_events_db
      - aptabase_db
    ports:
      - "8000:8080"
    environment:
      BASE_URL: http://127.0.0.1:8000
      AUTH_SECRET: change-me-auth-secret-must-be-at-least-32-bytes
      DATABASE_URL: Server=aptabase_db;Port=5432;User Id=aptabase;Password=change-me-postgres;Database=aptabase
      CLICKHOUSE_URL: Host=aptabase_events_db;Port=8123;Username=aptabase;Password=change-me-clickhouse

volumes:
  db-data:
  events-db-data:
